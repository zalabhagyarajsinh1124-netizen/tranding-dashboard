<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Dashboard</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121820;
            --card-dark: #1e2630;
            --card-hover: #263240;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
            --accent-capital: #3b82f6;
            --accent-profit: #22c55e;
            --accent-loss: #f97316;
            --accent-balance: #eab308;
            --border-color: #2e3a4e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 80px;
            background-color: #1a222d;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 30px;
        }

        .nav-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-icon.home { background-color: var(--accent-capital); }
        .nav-icon.journal { background-color: #ec4899; }
        .nav-icon.help { background-color: #06b6d4; }
        .nav-icon:hover { transform: scale(1.08); filter: brightness(1.2); }

        /* Main Dashboard Content */
        .main-content {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-dark);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-profit);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-profit);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Top 4 KPI Metric Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .kpi-card {
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .kpi-card:hover { transform: translateY(-3px); }
        .kpi-card.capital { background-color: var(--accent-capital); color: #fff; }
        .kpi-card.profit { background-color: var(--accent-profit); color: #fff; }
        .kpi-card.loss { background-color: var(--accent-loss); color: #fff; }
        .kpi-card.balance { background-color: var(--accent-balance); color: #1e293b; }

        .kpi-title {
            font-size: 26px;
            font-weight: 700;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 800;
            text-align: right;
        }

        /* Middle Section Grid */
        .dashboard-body {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .dashboard-body { grid-template-columns: 1fr; }
        }

        .stats-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-box {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-value {
            font-size: 48px;
            font-weight: 800;
            text-align: right;
            color: var(--text-main);
        }

        .split-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 10px;
        }

        .split-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .split-item .label {
            font-size: 24px;
            font-weight: 700;
        }

        .split-item .val {
            font-size: 38px;
            font-weight: 800;
        }

        /* Chart Area */
        .chart-box {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 320px;
        }

        /* Form Controls & Action Buttons */
        .controls-panel {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-sub);
        }

        input, select {
            background-color: #121820;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add { background-color: var(--accent-profit); color: #fff; }
        .btn-add:hover { background-color: #16a34a; }

        .btn-reset { background-color: #ef4444; color: #fff; margin-left: auto; }
        .btn-reset:hover { background-color: #dc2626; }

        /* Stock Ticker Bar */
        .ticker-bar {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .ticker-card {
            background-color: #161e27;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
            min-width: 140px;
        }

        .flash-up { animation: flashGreen 0.6s ease; }
        .flash-down { animation: flashRed 0.6s ease; }

        @keyframes flashGreen {
            0% { background-color: rgba(34, 197, 94, 0.4); }
            100% { background-color: #161e27; }
        }

        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.4); }
            100% { background-color: #161e27; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="nav-icon home" title="Home Dashboard"><i class="fa-solid fa-house"></i></div>
        <div class="nav-icon journal" title="Trade Journal"><i class="fa-solid fa-book"></i></div>
        <div class="nav-icon help" title="Support & Info"><i class="fa-solid fa-circle-question"></i></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Header Bar -->
        <div class="header-bar">
            <h2>Trading Performance Dashboard</h2>
            <div class="live-badge">
                <span class="live-dot"></span> REAL-TIME MARKET DATA ACTIVE
            </div>
        </div>

        <!-- Live Stock Price Ticker -->
        <div class="ticker-bar" id="tickerBar">
            <!-- Dynamically populated via JS -->
        </div>

        <!-- KPI Metric Cards Row -->
        <div class="kpi-grid">
            <div class="kpi-card capital">
                <div class="kpi-title">Capital</div>
                <div class="kpi-value" id="valCapital">₹100,000</div>
            </div>
            <div class="kpi-card profit">
                <div class="kpi-title">Profit</div>
                <div class="kpi-value" id="valProfit">₹7,340</div>
            </div>
            <div class="kpi-card loss">
                <div class="kpi-title">Loss</div>
                <div class="kpi-value" id="valLoss">₹0</div>
            </div>
            <div class="kpi-card balance">
                <div class="kpi-title">Balance</div>
                <div class="kpi-value" id="valBalance">₹107,340</div>
            </div>
        </div>

        <!-- Dashboard Body Section -->
        <div class="dashboard-body">
            
            <!-- Left Info Panel -->
            <div class="stats-column">
                <div class="stat-box">
                    <div class="stat-title">Total Trade's</div>
                    <div class="stat-value" id="valTotalTrades">3</div>
                </div>

                <div class="stat-box">
                    <div class="split-box">
                        <div class="split-item">
                            <span class="label" style="color: var(--accent-profit);">Profit</span>
                            <span class="val" id="valProfitTrades">3</span>
                        </div>
                        <div class="split-item" style="text-align: right;">
                            <span class="label" style="color: var(--accent-loss);">Loss</span>
                            <span class="val" id="valLossTrades">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart Panel -->
            <div class="chart-box">
                <div class="chart-header">
                    <span style="color: var(--text-sub); font-size: 13px;">Sum of NET P/L by Stock</span>
                </div>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Add Trade / Simulator Controls -->
        <div class="controls-panel">
            <div class="form-group">
                <label>Stock Name</label>
                <select id="inputStock">
                    <option value="SBIN">SBIN</option>
                    <option value="HUL">HUL</option>
                    <option value="ICICI">ICICIBANK</option>
                    <option value="HDFC">HDFCBANK</option>
                    <option value="RELIANCE">RELIANCE</option>
                </select>
            </div>
            <div class="form-group">
                <label>Entry Price (₹)</label>
                <input type="number" id="inputEntry" placeholder="e.g. 800" value="820">
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="inputQty" placeholder="e.g. 50" value="10">
            </div>
            <button class="btn-add" onclick="addTrade()"><i class="fa-solid fa-plus"></i> Add Live Trade</button>
            <button class="btn-reset" onclick="resetData()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        // Initial Mock Stocks with Live Base Prices
        const stocks = {
            'SBIN': { price: 825.40, basePL: 4240 },
            'HUL': { price: 2450.10, basePL: 1600 },
            'ICICI': { price: 1120.80, basePL: 1500 },
            'HDFC': { price: 1530.00, basePL: 0 },
            'RELIANCE': { price: 2980.50, basePL: 0 }
        };

        // User Positions Tracked
        let trades = [
            { stock: 'SBIN', qty: 20, entry: 613.40 },
            { stock: 'HUL', qty: 10, entry: 2290.10 },
            { stock: 'ICICI', qty: 15, entry: 1020.80 }
        ];

        let baseCapital = 100000;
        let chartInstance = null;

        // Initialize Bar Chart
        function initChart() {
            const ctx = document.getElementById('barChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['SBIN', 'HUL', 'ICICI', 'HDFC'],
                    datasets: [{
                        label: 'NET P/L (₹)',
                        data: [4240, 1600, 1500, 0],
                        backgroundColor: '#3b82f6',
                        borderRadius: 6,
                        barThickness: 18
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: '#2e3a4e' },
                            ticks: { color: '#94a3b8' },
                            min: 0,
                            max: 4500
                        },
                        y: {
                            grid: { display: false },
                            ticks: { color: '#ffffff', font: { weight: 'bold' } }
                        }
                    }
                }
            });
        }

        // Render Ticker UI
        function renderTicker() {
            const container = document.getElementById('tickerBar');
            container.innerHTML = '';
            for (let symbol in stocks) {
                const item = stocks[symbol];
                const div = document.createElement('div');
                div.className = 'ticker-card';
                div.id = `ticker-${symbol}`;
                div.innerHTML = `
                    <span style="font-weight: bold; color: #fff;">${symbol}</span>
                    <span id="price-${symbol}">₹${item.price.toFixed(2)}</span>
                `;
                container.appendChild(div);
            }
        }

        // Recalculate Dashboard Stats based on Live Market Prices
        function updateDashboard() {
            let totalProfit = 0;
            let totalLoss = 0;
            let profitTradeCount = 0;
            let lossTradeCount = 0;

            const stockPLMap = { 'SBIN': 0, 'HUL': 0, 'ICICI': 0, 'HDFC': 0 };

            trades.forEach(t => {
                const currentPrice = stocks[t.stock] ? stocks[t.stock].price : t.entry;
                const pnl = (currentPrice - t.entry) * t.qty;

                if (stockPLMap.hasOwnProperty(t.stock)) {
                    stockPLMap[t.stock] += pnl;
                } else {
                    stockPLMap[t.stock] = pnl;
                }

                if (pnl >= 0) {
                    totalProfit += pnl;
                    profitTradeCount++;
                } else {
                    totalLoss += Math.abs(pnl);
                    lossTradeCount++;
                }
            });

            const netBalance = baseCapital + totalProfit - totalLoss;

            // Update DOM UI Elements
            document.getElementById('valCapital').innerText = `₹${baseCapital.toLocaleString('en-IN')}`;
            document.getElementById('valProfit').innerText = `₹${Math.round(totalProfit).toLocaleString('en-IN')}`;
            document.getElementById('valLoss').innerText = `₹${Math.round(totalLoss).toLocaleString('en-IN')}`;
            document.getElementById('valBalance').innerText = `₹${Math.round(netBalance).toLocaleString('en-IN')}`;

            document.getElementById('valTotalTrades').innerText = trades.length;
            document.getElementById('valProfitTrades').innerText = profitTradeCount;
            document.getElementById('valLossTrades').innerText = lossTradeCount;

            // Update Chart Data horizontally
            if (chartInstance) {
                const labels = Object.keys(stockPLMap);
                const chartData = labels.map(key => Math.round(stockPLMap[key]));

                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = chartData;

                // Adjust X-axis maximum automatically
                const maxVal = Math.max(...chartData, 4500);
                chartInstance.options.scales.x.max = Math.ceil(maxVal / 500) * 500;
                chartInstance.update();
            }
        }

        // Real-Time Stock Price Simulator Engine
        function startRealTimeEngine() {
            setInterval(() => {
                const stockKeys = Object.keys(stocks);
                const randomStock = stockKeys[Math.floor(Math.random() * stockKeys.length)];

                // Random fluctuation between -0.8% to +0.8%
                const percentageChange = (Math.random() * 1.6 - 0.8) / 100;
                const oldPrice = stocks[randomStock].price;
                const newPrice = oldPrice * (1 + percentageChange);

                stocks[randomStock].price = newPrice;

                // UI Flash Effect on Stock Ticker
                const tickerCard = document.getElementById(`ticker-${randomStock}`);
                const priceSpan = document.getElementById(`price-${randomStock}`);

                if (priceSpan && tickerCard) {
                    priceSpan.innerText = `₹${newPrice.toFixed(2)}`;
                    tickerCard.classList.remove('flash-up', 'flash-down');

                    void tickerCard.offsetWidth; // Trigger DOM reflow

                    if (newPrice >= oldPrice) {
                        tickerCard.classList.add('flash-up');
                        priceSpan.style.color = '#22c55e';
                    } else {
                        tickerCard.classList.add('flash-down');
                        priceSpan.style.color = '#ef4444';
                    }
                }

                updateDashboard();
            }, 1500);
        }

        // User Action: Add New Trade
        function addTrade() {
            const stock = document.getElementById('inputStock').value;
            const entry = parseFloat(document.getElementById('inputEntry').value);
            const qty = parseInt(document.getElementById('inputQty').value);

            if (!entry || !qty || entry <= 0 || qty <= 0) {
                alert('મહેરબાની કરીને સાચો ભાવ અને જથ્થો (Quantity) દાખલ કરો.');
                return;
            }

            trades.push({ stock, entry, qty });
            updateDashboard();
        }

        // User Action: Reset Data
        function resetData() {
            trades = [];
            updateDashboard();
        }

        // App Launch Setup
        window.onload = function() {
            initChart();
            renderTicker();
            updateDashboard();
            startRealTimeEngine();
        };
    </script>
</body>
</html>
