<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121820;
            --card-dark: #1e2630;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
            --accent-capital: #3b82f6;
            --accent-profit: #22c55e;
            --accent-loss: #f97316;
            --accent-balance: #eab308;
            --border-color: #2e3a4e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 80px;
            background-color: #1a222d;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 30px;
        }

        .nav-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
            cursor: pointer;
        }
        .nav-icon.home { background-color: var(--accent-capital); }

        .main-content {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-dark);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-profit);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-profit);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .ticker-bar {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .ticker-card {
            background-color: #161e27;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            min-width: 150px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .kpi-card {
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
        }

        .kpi-card.capital { background-color: var(--accent-capital); color: #fff; }
        .kpi-card.profit { background-color: var(--accent-profit); color: #fff; }
        .kpi-card.loss { background-color: var(--accent-loss); color: #fff; }
        .kpi-card.balance { background-color: var(--accent-balance); color: #1e293b; }

        .kpi-title { font-size: 20px; font-weight: 700; }
        .kpi-value { font-size: 28px; font-weight: 800; text-align: right; }

        .dashboard-body {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .dashboard-body { grid-template-columns: 1fr; }
        }

        .stats-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-box {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .stat-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .stat-value { font-size: 36px; font-weight: 800; text-align: right; }

        .chart-box {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chart-container {
            position: relative;
            flex: 1;
            min-height: 280px;
        }

        /* Trades Table Section */
        .trades-section {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th { color: var(--text-sub); font-weight: 600; }

        /* Controls & Form Panel */
        .controls-panel {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label { font-size: 12px; color: var(--text-sub); }

        input, select {
            background-color: #121820;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add { background-color: var(--accent-profit); color: #fff; }
        .btn-edit { background-color: var(--accent-capital); color: #fff; padding: 5px 10px; font-size: 12px; }
        .btn-del { background-color: #ef4444; color: #fff; padding: 5px 10px; font-size: 12px; }

        .flash-up { animation: flashGreen 0.6s ease; }
        .flash-down { animation: flashRed 0.6s ease; }

        @keyframes flashGreen {
            0% { background-color: rgba(34, 197, 94, 0.4); }
            100% { background-color: #161e27; }
        }
        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.4); }
            100% { background-color: #161e27; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="nav-icon home"><i class="fa-solid fa-house"></i></div>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <h2>Live Trading Journal & Dashboard</h2>
            <div class="live-badge"><span class="live-dot"></span> REAL-TIME ACTIVE</div>
        </div>

        <!-- All Company Stocks Ticker -->
        <div class="ticker-bar" id="tickerBar"></div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card capital">
                <div class="kpi-title">Capital</div>
                <div class="kpi-value" id="valCapital">₹100,000</div>
            </div>
            <div class="kpi-card profit">
                <div class="kpi-title">Total Profit</div>
                <div class="kpi-value" id="valProfit">₹0</div>
            </div>
            <div class="kpi-card loss">
                <div class="kpi-title">Total Loss</div>
                <div class="kpi-value" id="valLoss">₹0</div>
            </div>
            <div class="kpi-card balance">
                <div class="kpi-title">Balance</div>
                <div class="kpi-value" id="valBalance">₹100,000</div>
            </div>
        </div>

        <!-- Dashboard Body -->
        <div class="dashboard-body">
            <div class="stats-column">
                <div class="stat-box">
                    <div class="stat-title">Total Trade's</div>
                    <div class="stat-value" id="valTotalTrades">0</div>
                </div>
            </div>
            <div class="chart-box">
                <span style="color: var(--text-sub); font-size: 13px;">Sum of NET P/L by Stock</span>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Add / Edit Trade Form -->
        <div class="controls-panel">
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-group">
                <label>Stock Name</label>
                <select id="inputStock">
                    <option value="SBIN">SBIN</option>
                    <option value="HUL">HUL</option>
                    <option value="ICICI">ICICI</option>
                    <option value="HDFC">HDFC</option>
                    <option value="RELIANCE">RELIANCE</option>
                    <option value="TCS">TCS</option>
                    <option value="INFY">INFY</option>
                </select>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="inputType">
                    <option value="BUY">BUY</option>
                    <option value="SELL">SELL</option>
                </select>
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="time" id="inputTime">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="inputPrice" placeholder="Price">
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="inputQty" placeholder="Qty">
            </div>
            <div class="form-group">
                <label>Target (₹)</label>
                <input type="number" id="inputTarget" placeholder="Target">
            </div>
            <div class="form-group">
                <label>Stop Loss (₹)</label>
                <input type="number" id="inputSL" placeholder="Stop Loss">
            </div>
            <button class="btn-add" id="saveBtn" onclick="saveTrade()"><i class="fa-solid fa-plus"></i> Add Trade</button>
        </div>

        <!-- Trades History Table -->
        <div class="trades-section">
            <h3 style="margin-bottom: 15px;">Active Trade History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Stock</th>
                        <th>Type</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Target</th>
                        <th>Stop Loss</th>
                        <th>Net P/L</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tradesTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const stocks = {
            'SBIN': { price: 825.40, change: +1.2 },
            'HUL': { price: 2450.10, change: -0.5 },
            'ICICI': { price: 1120.80, change: +0.8 },
            'HDFC': { price: 1530.00, change: +1.5 },
            'RELIANCE': { price: 2980.50, change: -1.1 },
            'TCS': { price: 3900.00, change: +0.4 },
            'INFY': { price: 1650.20, change: -0.2 }
        };

        let trades = [];
        let baseCapital = 100000;
        let chartInstance = null;

        document.getElementById('inputTime').value = new Date().toTimeString().slice(0, 5);

        function initChart() {
            const ctx = document.getElementById('barChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(stocks),
                    datasets: [{
                        label: 'NET P/L (₹)',
                        data: new Array(Object.keys(stocks).length).fill(0),
                        backgroundColor: '#3b82f6',
                        borderRadius: 6,
                        barThickness: 15
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#2e3a4e' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { display: false }, ticks: { color: '#ffffff', font: { weight: 'bold' } } }
                    }
                }
            });
        }

        function renderTicker() {
            const container = document.getElementById('tickerBar');
            container.innerHTML = '';
            for (let symbol in stocks) {
                const item = stocks[symbol];
                const isGreen = item.change >= 0;
                const div = document.createElement('div');
                div.className = 'ticker-card';
                div.id = `ticker-${symbol}`;
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <span style="font-weight: bold; color: #fff;">${symbol}</span>
                        <span style="color: ${isGreen ? '#22c55e' : '#ef4444'};">${isGreen ? '+' : ''}${item.change}%</span>
                    </div>
                    <span id="price-${symbol}" style="font-size: 15px; font-weight: bold;">₹${item.price.toFixed(2)}</span>
                `;
                container.appendChild(div);
            }
        }

        function updateDashboard() {
            let totalProfit = 0;
            let totalLoss = 0;
            const stockPLMap = {};
            Object.keys(stocks).forEach(s => stockPLMap[s] = 0);

            const tbody = document.getElementById('tradesTableBody');
            tbody.innerHTML = '';

            trades.forEach((t, index) => {
                const currentPrice = stocks[t.stock] ? stocks[t.stock].price : t.price;
                let pnl = 0;
                if (t.type === 'BUY') {
                    pnl = (currentPrice - t.price) * t.qty;
                } else {
                    pnl = (t.price - currentPrice) * t.qty;
                }

                stockPLMap[t.stock] = (stockPLMap[t.stock] || 0) + pnl;

                if (pnl >= 0) totalProfit += pnl;
                else totalLoss += Math.abs(pnl);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.time}</td>
                    <td><b>${t.stock}</b></td>
                    <td><span style="color: ${t.type === 'BUY' ? '#22c55e' : '#f97316'};">${t.type}</span></td>
                    <td>₹${t.price}</td>
                    <td>${t.qty}</td>
                    <td>₹${t.target}</td>
                    <td>₹${t.sl}</td>
                    <td style="color: ${pnl >= 0 ? '#22c55e' : '#ef4444'}; font-weight: bold;">₹${pnl.toFixed(2)}</td>
                    <td>
                        <button class="btn-edit" onclick="editTrade(${index})">Edit</button>
                        <button class="btn-del" onclick="deleteTrade(${index})">Del</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const netBalance = baseCapital + totalProfit - totalLoss;

            document.getElementById('valCapital').innerText = `₹${baseCapital.toLocaleString('en-IN')}`;
            document.getElementById('valProfit').innerText = `₹${Math.round(totalProfit).toLocaleString('en-IN')}`;
            document.getElementById('valLoss').innerText = `₹${Math.round(totalLoss).toLocaleString('en-IN')}`;
            document.getElementById('valBalance').innerText = `₹${Math.round(netBalance).toLocaleString('en-IN')}`;
            document.getElementById('valTotalTrades').innerText = trades.length;

            if (chartInstance) {
                const labels = Object.keys(stockPLMap);
                const chartData = labels.map(key => Math.round(stockPLMap[key]));
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = chartData;
                chartInstance.update();
            }
        }

        function saveTrade() {
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const stock = document.getElementById('inputStock').value;
            const type = document.getElementById('inputType').value;
            const time = document.getElementById('inputTime').value;
            const price = parseFloat(document.getElementById('inputPrice').value);
            const qty = parseInt(document.getElementById('inputQty').value);
            const target = parseFloat(document.getElementById('inputTarget').value);
            const sl = parseFloat(document.getElementById('inputSL').value);

            if (!price || !qty) {
                alert('Kripya price ane quantity nakho.');
                return;
            }

            const tradeObj = { stock, type, time, price, qty, target, sl };

            if (editIndex === -1) {
                trades.push(tradeObj);
            } else {
                trades[editIndex] = tradeObj;
                document.getElementById('editIndex').value = -1;
                document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Add Trade';
            }

            updateDashboard();
        }

        function editTrade(index) {
            const t = trades[index];
            document.getElementById('inputStock').value = t.stock;
            document.getElementById('inputType').value = t.type;
            document.getElementById('inputTime').value = t.time;
            document.getElementById('inputPrice').value = t.price;
            document.getElementById('inputQty').value = t.qty;
            document.getElementById('inputTarget').value = t.target;
            document.getElementById('inputSL').value = t.sl;
            document.getElementById('editIndex').value = index;
            document.getElementById('saveBtn').innerHTML = 'Update Trade';
        }

        function deleteTrade(index) {
            trades.splice(index, 1);
            updateDashboard();
        }

        function startRealTimeEngine() {
            setInterval(() => {
                const stockKeys = Object.keys(stocks);
                const randomStock = stockKeys[Math.floor(Math.random() * stockKeys.length)];
                const changePct = (Math.random() * 1.2 - 0.6);
                
                stocks[randomStock].price += (stocks[randomStock].price * changePct) / 100;
                stocks[randomStock].change = parseFloat((stocks[randomStock].change + changePct).toFixed(2));

                const tickerCard = document.getElementById(`ticker-${randomStock}`);
                const priceSpan = document.getElementById(`price-${randomStock}`);

                if (priceSpan && tickerCard) {
                    priceSpan.innerText = `₹${stocks[randomStock].price.toFixed(2)}`;
                    tickerCard.classList.remove('flash-up', 'flash-down');
                    void tickerCard.offsetWidth;
                    tickerCard.classList.add(changePct >= 0 ? 'flash-up' : 'flash-down');
                }

                updateDashboard();
            }, 2000);
        }

        window.onload = function() {
            initChart();
            renderTicker();
            updateDashboard();
            startRealTimeEngine();
        };
    </script>
</body>
</html>
